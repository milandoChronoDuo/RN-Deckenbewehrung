<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img"><title>Zusammenfassung ist eine geprüfte Option</title><rect width="800" height="360" fill="white"/><g font-family="sans-serif" font-size="20" fill="#172d3d"><text x="24" y="34">Zusammenfassung ist eine geprüfte Option</text><rect x="60" y="90" width="200" height="160" fill="none" stroke="#12628a" stroke-width="3"/><rect x="400" y="90" width="200" height="160" fill="none" stroke="#12628a" stroke-width="3"/><path d="M260 170H400 M260 160V180 M400 160V180" stroke="#172d3d" stroke-width="2"/><text x="285" y="150">Abstand</text><rect x="50" y="80" width="560" height="180" fill="none" stroke="#a14215" stroke-dasharray="8 8"/><text x="60" y="300">Zusatzstahl, Öffnungen und Gesamtausdehnung prüfen.</text><text x="24" y="340" font-size="15">Schema · keine Bemessungswerte · nicht maßstäblich</text></g></svg>