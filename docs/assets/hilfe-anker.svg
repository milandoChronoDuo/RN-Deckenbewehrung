<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img"><title>Verankerung über den Bedarfsbereich hinaus</title><rect width="800" height="360" fill="white"/><g font-family="sans-serif" font-size="20" fill="#172d3d"><text x="24" y="34">Verankerung über den Bedarfsbereich hinaus</text><rect x="240" y="90" width="300" height="160" fill="#12628a" fill-opacity=".15"/><path d="M80 170H710" stroke="#a14215" stroke-width="7"/><path d="M80 210H240 M540 210H710" stroke="#172d3d" stroke-width="2"/><text x="90" y="240">Verankerung</text><text x="550" y="240">Verankerung</text><text x="270" y="120">Bedarfsbereich</text><text x="80" y="290">Beide Enden müssen innerhalb der zulässigen Geometrie liegen.</text><text x="24" y="340" font-size="15">Schema · keine Bemessungswerte · nicht maßstäblich</text></g></svg>