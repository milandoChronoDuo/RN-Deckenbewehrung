[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rn-deckenbewehrung"
version = "0.1.0"
description = "Allplan 2026 Entwicklungsstand und unabhängig prüfbarer Bewehrungskern"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "lxml>=5,<7"]

[project.scripts]
rn-demo = "rn_deckenbewehrung.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
